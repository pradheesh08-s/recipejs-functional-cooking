<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Process</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="shell">
            <p class="eyebrow">Recipe Process</p>
            <h1 id="recipeTitle">Loading recipe...</h1>
            <p id="recipeMeta" class="subtitle"></p>
        </div>
    </header>

    <main class="shell recipe-page-layout">
        <section class="panel recipe-process-panel">
            <p id="recipeDescription" class="recipe-description"></p>
            <h2 class="section-title">Ingredients</h2>
            <div id="recipe-ingredients" aria-live="polite"></div>
            <div class="ingredient-actions">
                <button id="editIngredients" type="button">Edit Ingredients</button>
                <button id="saveIngredients" type="button" class="save-btn">Save</button>
                <button id="cancelIngredients" type="button" class="cancel-btn">Cancel</button>
                <button id="toggleIngredientLock" type="button" class="lock-btn">Lock (Developer)</button>
            </div>
            <p id="ingredientStatus" class="ingredient-status" aria-live="polite"></p>
            <h2 class="section-title">How to make</h2>
            <div id="recipe-process" aria-live="polite"></div>
            <button id="backToRecipes" type="button" class="back-btn">Back to recipes</button>
        </section>
    </main>

    <script src="app.js" defer></script>
</body>
</html>
